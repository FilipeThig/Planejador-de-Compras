<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Planejador de compras</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-page"><section class="panel"><h1>Entrar</h1><p class="sub">Acesse suas compras em qualquer dispositivo.</p>
<form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button></form><p id="message" class="auth-message" role="status" aria-live="polite"></p>
<p class="auth-links">Ainda não tem conta? <a href="cadastro.html">Cadastrar</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script></body></html>
